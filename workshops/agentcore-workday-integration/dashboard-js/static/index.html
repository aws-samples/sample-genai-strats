<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Agent on Amazon Bedrock AgentCore</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/app/css/app.css">
</head>

<body>

  <!-- Overlay: connecting / login -->
  <div id="overlay">
    <div class="card shadow" style="width:420px;">
      <div class="card-body text-center p-5">
        <h4 class="mb-3">Welcome!</h4>
        <hr>
        <div id="ov-connecting">
          <p class="text-muted">Connecting to the agent&hellip;</p>
          <div class="spinner-border text-primary mt-2"></div>
        </div>
        <div id="ov-login" style="display:none;">
          <p class="text-muted">Authentication required</p>
          <button id="btn-login" class="btn btn-primary btn-lg w-100 mt-2">Login with Workday</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main chat UI -->
  <div class="container-fluid py-3" id="main-container">
    <div class="d-flex align-items-center mb-3" style="height:40px;">
      <h5 id="page-header" class="mb-0 me-auto">AWSome HR Agent &mdash; Amazon Bedrock AgentCore + Workday</h5>
      <div class="logo-chip">
        <img src="images/aws-logo.png" alt="Amazon">
        <span class="logo-x">&times;</span>
        <img src="images/workday-logo.png" alt="Workday">
      </div>
    </div>
    <div id="chat-box" class="mb-3">
      <div id="chat-empty">Enter your message below, or pick one of the samples.</div>
    </div>
    <form id="chat-form" class="d-flex gap-2">
      <input id="chat-input" type="text" class="form-control" placeholder="Type your message&hellip;"
        autocomplete="off">
      <button type="submit" class="btn btn-primary" style="padding-left:2rem; padding-right:2rem; white-space:nowrap;">Send</button>
    </form>
    <div id="examples" class="mt-2 d-flex justify-content-center gap-2 flex-wrap"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@18.2.0/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>
  <script src="/app/js/app.js"></script>
</body>

</html>
