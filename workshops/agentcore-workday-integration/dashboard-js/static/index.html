<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HR Agent</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/app/css/app.css">
</head>

<body>

  <!-- Overlay: connecting / login -->
  <div id="overlay">
    <div class="card shadow" style="width:420px;">
      <div class="card-body text-center p-5">
        <h4 class="mb-3">Welcome to HR Agent</h4>
        <hr>
        <div id="ov-connecting">
          <p class="text-muted">Connecting to the agent&hellip;</p>
          <div class="spinner-border text-primary mt-2"></div>
        </div>
        <div id="ov-login" style="display:none;">
          <p class="text-muted">Authentication required</p>
          <button id="btn-login" class="btn btn-primary btn-lg w-100 mt-2">Login with Workday</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Waiting modal -->
  <div class="modal fade" id="waiting-modal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-body text-center py-4">
          <div class="spinner-border text-primary mb-3"></div>
          <p class="mb-0">Waiting for agent response&hellip;</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Main chat UI -->
  <div class="container-fluid py-3" style="max-width:860px;">
    <div class="d-flex align-items-center mb-3" style="height:40px;">
      <h5 class="mb-0 me-auto">AwesomeCorp HR Agent &mdash; Amazon Bedrock AgentCore + Workday</h5>
      <img src="images/aws-logo.png" alt="Amazon" style="height:100%; object-fit:contain; margin-left:16px;">
      <span style="margin: 0 10px; font-size:1.2rem; color:#888; line-height:1;">&times;</span>
      <img src="images/workday-logo.png" alt="Workday" style="height:100%; object-fit:contain;">
    </div>
    <div id="chat-box" class="mb-3"></div>
    <form id="chat-form" class="d-flex gap-2">
      <input id="chat-input" type="text" class="form-control" placeholder="Type your message&hellip;"
        autocomplete="off">
      <button type="submit" class="btn btn-primary" style="padding-left:2rem; padding-right:2rem; white-space:nowrap;">Send</button>
    </form>
    <div id="examples" class="mt-2 d-flex justify-content-between"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/app/js/app.js"></script>
</body>

</html>
